[package]
name = "dxn_intl"
description = "Locale-aware plurals, numbers and dates for Rust on ICU4X's CLDR data, independent of any UI framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["i18n", "intl", "plural", "number-format", "date-format"]
categories = ["internationalization", "localization", "value-formatting"]

[dependencies]
fixed_decimal.workspace = true
icu.workspace = true
icu_datetime.workspace = true
icu_decimal.workspace = true
icu_provider.workspace = true
icu_experimental.workspace = true
jiff = { workspace = true, optional = true }

[features]
# Instants in IANA time zones (`DateTime::from_instant`, `DateTime::from_unix_millis_in`), on
# jiff's copy of the time zone database.
tz = ["dep:jiff"]

[lints]
workspace = true
