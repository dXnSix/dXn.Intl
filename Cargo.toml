[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dXnSix/dXn.Intl"
homepage = "https://github.com/dXnSix/dXn.Intl"

[workspace.dependencies]
# `ryu` reads floats as the shortest decimal that reads back the same.
fixed_decimal = { version = "0.7.3", features = ["ryu"] }
icu = "2.4.0"
icu_provider = "2.4.0"
# Percent and currency formatting live in ICU4X's unstable crate: pinned exactly, since any
# release may change its API.
icu_experimental = "=0.7.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
