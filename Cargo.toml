[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dXnSix/dXn.Intl"
homepage = "https://github.com/dXnSix/dXn.Intl"

[workspace.dependencies]
# `ryu` reads floats as the shortest decimal that reads back the same.
fixed_decimal = { version = "0.7.3", features = ["ryu"] }
icu = "2.4.0"
# Compact numbers (`icu_decimal`) and date ranges (`icu_datetime`) are behind ICU4X's `unstable`
# features: pinned exactly, like `icu_experimental`, since their API may change in any release.
icu_datetime = { version = "=2.4.0", features = ["unstable"] }
icu_decimal = { version = "=2.4.0", features = ["unstable"] }
icu_provider = "2.4.0"
# Percent and currency formatting, units, relative time and display names live in ICU4X's
# unstable crate: pinned exactly, since any release may change its API.
icu_experimental = "=0.7.0"
# Time zones for the `tz` feature: the IANA database compiled in (`tzdb-bundle-always`), so no
# system files are read and wasm32 gets the same zones.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
