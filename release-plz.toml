# release-plz: keeps a release pull request with the version bump and the CHANGELOG.md section
# open on `main`; merging it makes the `release` job tag `vX.Y.Z` and create the GitHub Release
# with that section as notes. Nothing is published to crates.io. See docs/releasing.md.
#
# 0.x policy: `fix`, `perf` and `feat` bump the patch (0.1.0 -> 0.1.1); a breaking change (`!`
# after the type or scope, or a `BREAKING CHANGE:` footer) bumps the minor (0.1.x -> 0.2.0). A
# breaking commit also carries a `Migration:` footer; the changelog prints it.

[workspace]
# Versions come from git tags; nothing goes to a registry. The manifests stay crates.io-ready
# (`cargo package --workspace` passes), but consumers depend on a release tag.
git_only = true
publish = false
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
changelog_update = true
# Breaking changes are declared by their commits.
semver_check = false
# Only changes that reach users start a release; docs, tests, CI and build commits ride along in
# the next one.
release_commits = "^(feat|fix|perf)"

[[package]]
name = "dxn_intl"
# The package lives in `crates/`; the repository keeps one root changelog.
changelog_path = "./CHANGELOG.md"

[changelog]
header = """# Changelog

All notable changes to `dxn_intl` are documented in this file. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the project follows
[Semantic Versioning](https://semver.org/spec/v2.0.0.html). It is generated from
Conventional Commits by release-plz.

"""
# One `## [X.Y.Z] - YYYY-MM-DD` section per release; release-plz uses it as the Release body.
# Each `Migration:` commit footer is rendered as an indented *Migration:* line under its entry.
body = """
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
{%- if commit.scope -%}
- *({{ commit.scope }})* {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% else -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% endif -%}
{% for footer in commit.footers | filter(attribute="token", value="Migration") -%}
{{ "  " }}*Migration:* {{ footer.value }}
{% endfor -%}
{% endfor -%}
{% endfor %}
"""
trim = true
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^(ci|build)", group = "Build and CI" },
  { message = "^test", group = "Tests" },
  { message = "^chore", group = "Maintenance" },
]
